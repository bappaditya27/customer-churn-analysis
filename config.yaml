# Configuration for Customer Churn Prediction Project

# Database Configuration
database:
  type: "postgresql"  # Options: postgresql, mysql, sqlite
  host: "localhost"
  port: 5432
  username: "your_username"
  password: "your_password"
  database: "customer_db"
  # For SQLite, use: sqlite:///./data/customer_data.db

# Data Configuration
data:
  raw_path: "data/raw/"
  processed_path: "data/processed/"
  test_size: 0.2
  random_state: 42
  missing_value_threshold: 0.5  # Drop columns with >50% missing

# Preprocessing
preprocessing:
  handle_missing: "mean"  # Options: mean, median, drop, ffill
  remove_outliers: true
  outlier_method: "iqr"  # Options: iqr, zscore
  scaling_method: "standard"  # Options: standard, minmax, robust

# Feature Engineering
features:
  temporal_features: true
  interaction_features: true
  polynomial_features: false
  feature_selection_method: "correlation"  # Options: correlation, rfe, chi2
  feature_selection_k: 20  # Top k features to select

# Model Configuration
model:
  algorithms:
    - "logistic_regression"
    - "random_forest"
    - "xgboost"
    - "gradient_boosting"
  
  hyperparameters:
    logistic_regression:
      C: 1.0
      max_iter: 1000
    
    random_forest:
      n_estimators: 100
      max_depth: 10
      min_samples_split: 5
      random_state: 42
    
    xgboost:
      n_estimators: 100
      learning_rate: 0.1
      max_depth: 6
      random_state: 42
    
    gradient_boosting:
      n_estimators: 100
      learning_rate: 0.1
      max_depth: 5
      random_state: 42

# Cross-Validation
cross_validation:
  cv_folds: 5
  cv_strategy: "stratified"  # Options: kfold, stratified, timeseries

# Evaluation
evaluation:
  metrics:
    - "accuracy"
    - "precision"
    - "recall"
    - "f1"
    - "auc_roc"
    - "auc_pr"
  
  threshold: 0.5  # Classification threshold

# Class Imbalance Handling
class_imbalance:
  handle: true
  method: "smote"  # Options: smote, random_oversampling, random_undersampling
  sampling_strategy: "auto"

# Logging
logging:
  level: "INFO"  # Options: DEBUG, INFO, WARNING, ERROR, CRITICAL
  log_file: "logs/churn_analysis.log"

# Output & Artifacts
output:
  model_path: "models/"
  model_name: "churn_model.pkl"
  report_path: "reports/"
  figure_path: "reports/figures/"
  save_predictions: true
  
# Random Seeds (for reproducibility)
seeds:
  random_state: 42
  numpy_seed: 42
  tensorflow_seed: 42
